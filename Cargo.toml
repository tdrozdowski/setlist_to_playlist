[package]
name = "setlist_to_playlist"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
swift-bridge = "0.1.57"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }

[build-dependencies]
swift-bridge-build = "0.1.57"

[dev-dependencies]
mockall = "0.13.1"
